<div class="flex items-center justify-center w-screen h-screen fixed top-0 left-0 bg-white z-50">
  <div
    class="w-[400px] h-full bg-[#2E6969] text-white flex flex-col gap-2 items-center justify-center"
  >
    <div class="text-5xl">ProZ.com</div>
  </div>
  <div class="flex-grow flex items-center justify-center">
    <app-login *ngIf="showLogin" (showRegister)="toogleLoginRegister()"></app-login>

  </div>
</div>
