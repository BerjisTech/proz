<div class="fixed top-0 left-0 z-[100000] bg-white w-screen h-screen flex">
  <span
    class="material-symbols-outlined absolute top-10 left-10 text-white"
    role="button"
    (click)="closeImageView()"
    >cancel</span
  >
  <div class="flex-grow h-screen bg-black flex items-center justify-center">
    <img src="{{ activeImage.image }}" class="object-contain" />
  </div>
  <div class="w-[400px] h-screen overflow-y-auto overflow-x-hidden">
    <app-feed-item
      [feedItem]="feedItem"
      (onFeedImageClick)="feedImageClicked($event)"
    ></app-feed-item>
  </div>
</div>
