<!-- Return global search results instances -->
<div class="w-screen flex p-5">
    <div class="flex-grow p-3">
        <div>Your search for <span class="font-bold">{{ searchTerm }}</span> has <span class="font-bold">{{searchResults.length}}</span> results</div>
        <ng-container *ngFor="let result of searchResults; index as i">
            <app-global-search-results [searchResult]="result"></app-global-search-results>
            <div *ngIf="shouldInjectComponent(i)" class="w-full h-[200px] bg-green-200 rounded-md p-3">
                Injected after {{ i }}
            </div>
        </ng-container>
    </div>
    <div class="flex-grow bg-slate-200 rounded-md p-3 h-[200vh] min-w-[400px]">
        searchSideBar
    </div>
</div>
